[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deal-scout"
version = "0.1.0"
description = "Configurable deal scanner for local and online bargain hunting"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["deals", "shopping", "price-tracker", "redflagdeals", "local-deals"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Office/Business",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
deal-scout = "deal_scout.cli:main"

[project.urls]
Homepage = "https://github.com/mizoz/deal-scout"
Issues = "https://github.com/mizoz/deal-scout/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
